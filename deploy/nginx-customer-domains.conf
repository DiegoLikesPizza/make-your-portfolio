# Customer custom domains — the default server for any hostname that has no
# block of its own.
#
# Without this, an unmatched Host falls through to whichever block nginx loaded
# first, which served lfdiego.xyz's content on other people's domains behind a
# certificate warning. The app already knows how to answer for a custom
# hostname: it looks the name up, serves the portfolio if the domain is
# verified and published, and 404s otherwise. It just has to be reached.
#
# Once a domain is verified, deploy/issue-cert.sh gives it its own block with a
# real certificate, and that block wins over this one.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Must stay on plain HTTP and must not be proxied: this is how certbot
    # proves control of a customer's domain before any certificate exists.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    client_max_body_size 20M;

    location / {
        proxy_pass http://127.0.0.1:3004;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;

    # A self-signed certificate on purpose. A browser reaching this block is on
    # a hostname we hold no certificate for, so it will warn whatever we
    # present — and presenting lfdiego.xyz's certificate for somebody else's
    # domain is worse than presenting an obviously anonymous one.
    ssl_certificate /etc/ssl/certs/ssl-cert-snakeoil.pem;
    ssl_certificate_key /etc/ssl/private/ssl-cert-snakeoil.key;

    client_max_body_size 20M;

    location / {
        proxy_pass http://127.0.0.1:3004;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }
}
