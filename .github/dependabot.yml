# Version updates. Security updates are a repository setting (enabled) and open
# their own PRs as soon as an advisory lands, regardless of this schedule.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # One PR a week for routine bumps; a major version gets a PR of its own,
      # because that is the one that needs reading.
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
