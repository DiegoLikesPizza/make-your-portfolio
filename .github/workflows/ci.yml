name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to the same branch makes the previous run's answer irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # Nothing in this job connects to a database or signs anyone in. These only
      # satisfy code that reads them when it is imported.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      AUTH_SECRET: ci-only-not-a-secret
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # What the deployed box runs; the Dockerfile's Node 24 is the newer of the two.
          node-version: 22
          cache: npm

      # Not `npm ci`: the lockfile is generated on Windows and omits Linux-only
      # optional packages, which `npm ci` refuses to fill in (see README).
      - run: npm install --no-audit --no-fund

      # src/generated/prisma is gitignored, and type-checking needs the client.
      - run: npx prisma generate --config prisma7.config.ts

      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test
      # Fails on Turbopack's whole-project tracing warning, not just on errors: a
      # file path it can't scope pulls the entire repository into the standalone
      # output that deploys ship (#93).
      - name: Build
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build.log
          if grep -q "Dynamic filesystem access causes tracing of the whole project" build.log; then
            echo "::error::The build traces the whole project into its output. Scope the file path it names (see src/lib/storage.ts)."
            exit 1
          fi

      # Needs Linux (symlinks, flock), which is why it runs here and not locally.
      - name: Deploy script
        run: bash deploy/test-redeploy.sh

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
